<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — AutoGlow Car Care</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101114;color:#F7F7F8;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box}
      main{max-width:440px;text-align:center}
      h1{font-size:28px;margin:0 0 12px}
      p{color:#B4B7BC;line-height:1.6;margin:0 0 24px}
      button{background:#F7F7F8;color:#101114;border:0;border-radius:999px;padding:14px 28px;font-weight:600;font-size:15px;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Pages you've already visited are still available. Booking enquiries and contact forms need an internet connection, so please reconnect to send one.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
